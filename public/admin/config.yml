backend:
  name: github
  repo: roywikan/parent-my-id
  branch: main
  base_url: https://decap-oauth.apl.workers.dev
  auth_endpoint: /auth

site_url: https://parent.my.id
display_url: https://parent.my.id

# Lokasi penyimpanan gambar/media di repository GitHub
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

# Struktur Koleksi Konten
collections:
  - name: "blog"
    label: "Blog / Berita"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Judul", name: "title", widget: "string" }
      - { label: "Tanggal Publikasi", name: "date", widget: "datetime" }
      - { label: "Deskripsi Singkat", name: "description", widget: "string" }
      - { label: "Gambar Utama", name: "heroImage", widget: "image", required: false }
      - { label: "Isi Konten", name: "body", widget: "markdown" }
      
